name: Temporary Security Audit

on:
  push:
    branches:
      - refactor/core-life-manager
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: npm audit report
        run: npm audit --json || true

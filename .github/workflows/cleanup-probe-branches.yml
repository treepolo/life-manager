name: Cleanup Probe Branches

on:
  push:
    branches:
      - cleanup/post-cutover-20260902

permissions:
  contents: write

jobs:
  delete-probes:
    if: "${{ github.event.head_commit.message == 'chore: remove cleanup probe branches' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Delete known temporary probe branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            cleanup/dependency-prune-probe-20260902 \
            cleanup/repo-audit-probe-20260902 \
            cleanup/decimal-prune-probe-20260902 \
            cleanup/code-split-probe-20260902
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done

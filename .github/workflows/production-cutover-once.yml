name: Production Cutover Once

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy-production-once:
    if: github.event.head_commit.message == 'ops: deploy production cutover'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Check production readiness
        run: npm run check:production-deploy-ready

      - name: Build client
        run: npm run build:client

      - name: Deploy production
        run: npx wrangler deploy --config wrangler.toml --env production

name: Repair lockfile

on:
  push:
    branches:
      - refactor/core-life-manager
    paths:
      - .github/workflows/repair-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor/core-life-manager

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit repaired lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/repair-lock.yml
          git commit -m "chore: repair npm lockfile"
          git push origin HEAD:refactor/core-life-manager

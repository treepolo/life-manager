name: Code Split Probe

on:
  push:
    branches:
      - cleanup/code-split-probe-20260902

permissions:
  contents: write

jobs:
  split-and-verify:
    if: "${{ github.event.head_commit.message == 'chore: probe client code splitting' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply lazy-loading boundaries
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(text, before, after, label) {
            if (!text.includes(before)) throw new Error(`Missing pattern: ${label}`);
            return text.replace(before, after);
          }

          let app = fs.readFileSync('src/app/App.tsx', 'utf8');
          app = replaceOnce(app,
            'import { QueryClient, QueryClientProvider } from "@tanstack/react-query";\n',
            'import { QueryClient, QueryClientProvider } from "@tanstack/react-query";\nimport { lazy, Suspense } from "react";\n',
            'App react import');
          app = app.replace('import { HomePage } from "@/app/pages/HomePage";\n', '');
          app = app.replace('import { SettingsPage } from "@/app/pages/SettingsPage";\n', '');
          app = app.replace('import { TasksPage } from "@/app/pages/TasksPage";\n', '');
          app = replaceOnce(app,
            'import { SyncProvider } from "@/app/providers/SyncProvider";\n\n',
            'import { SyncProvider } from "@/app/providers/SyncProvider";\n\nconst HomePage = lazy(() => import("@/app/pages/HomePage").then((module) => ({ default: module.HomePage })));\nconst TasksPage = lazy(() => import("@/app/pages/TasksPage").then((module) => ({ default: module.TasksPage })));\nconst SettingsPage = lazy(() => import("@/app/pages/SettingsPage").then((module) => ({ default: module.SettingsPage })));\n\n',
            'App lazy declarations');
          app = replaceOnce(app,
            '        <RouterProvider router={router} />\n',
            '        <Suspense fallback={<div className="page crayon-page"><p className="notice-strip">正在載入頁面…</p></div>}>\n          <RouterProvider router={router} />\n        </Suspense>\n',
            'Router suspense');
          fs.writeFileSync('src/app/App.tsx', app);

          let home = fs.readFileSync('src/app/pages/HomePage.tsx', 'utf8');
          home = replaceOnce(home,
            'import { useMemo, type CSSProperties, type FormEvent } from "react";\n',
            'import { lazy, Suspense, useMemo, type CSSProperties, type FormEvent } from "react";\n',
            'Home react import');
          home = home.replace('import { CrayonLineChart } from "@/components/CrayonLineChart";\n', '');
          home = replaceOnce(home,
            'import "./HomePage.css";\n\n',
            'import "./HomePage.css";\n\nconst CrayonLineChart = lazy(() => import("@/components/CrayonLineChart").then((module) => ({ default: module.CrayonLineChart })));\n\n',
            'Home lazy chart');
          home = replaceOnce(home,
            '      <div className="chart-stack">\n',
            '      <Suspense fallback={<div className="crayon-panel chart-empty">正在載入成果圖…</div>}>\n        <div className="chart-stack">\n',
            'Chart suspense open');
          home = replaceOnce(home,
            '      </div>\n    </div>\n  );\n}\n',
            '        </div>\n      </Suspense>\n    </div>\n  );\n}\n',
            'Chart suspense close');
          fs.writeFileSync('src/app/pages/HomePage.tsx', home);
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

      - name: Report bundle sizes
        shell: bash
        run: |
          echo "--- JS chunks ---"
          find dist/assets -type f -name '*.js' -printf '%s %p\n' | sort -nr
          echo "--- total ---"
          du -sh dist

      - name: Commit verified code split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/pages/HomePage.tsx
          git commit -m "perf: split routes and chart bundle"
          git push origin HEAD:cleanup/code-split-probe-20260902

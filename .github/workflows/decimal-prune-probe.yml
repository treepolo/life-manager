name: Decimal Prune Probe

on:
  push:
    branches:
      - cleanup/decimal-prune-probe-20260902

permissions:
  contents: write

jobs:
  prune-and-verify:
    if: "${{ github.event.head_commit.message == 'chore: audit decimal dependency' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove unused decimal dependency
        run: npm uninstall decimal.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

      - name: Commit verified package changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "No package changes"; exit 0; }
          git commit -m "chore: remove unused decimal dependency"
          git push origin HEAD:cleanup/decimal-prune-probe-20260902

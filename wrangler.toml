name = "life-manager"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*", "/oauth/*" ]

[[d1_databases]]
binding = "LIFE_DB"
database_name = "life-manager-local"
database_id = "local"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "local"
APP_TIMEZONE = "Asia/Taipei"
INSTAGRAM_API_VERSION = "v23.0"
PROVIDER_SYNC_INTERVAL_HOURS = "6"
OPERATION_LOG_RETENTION_DAYS = "365"
NOTIFICATION_LOG_RETENTION_DAYS = "365"
OAUTH_STATE_RETENTION_DAYS = "30"

[triggers]
crons = [ "*/15 * * * *" ]

[env.staging]
name = "life-manager-staging"
workers_dev = true

[env.staging.vars]
ENVIRONMENT = "staging"
APP_TIMEZONE = "Asia/Taipei"
INSTAGRAM_API_VERSION = "v23.0"
PROVIDER_SYNC_INTERVAL_HOURS = "6"
OPERATION_LOG_RETENTION_DAYS = "365"
NOTIFICATION_LOG_RETENTION_DAYS = "365"
OAUTH_STATE_RETENTION_DAYS = "30"

[env.production]
name = "life-manager"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
APP_TIMEZONE = "Asia/Taipei"
INSTAGRAM_API_VERSION = "v23.0"
PROVIDER_SYNC_INTERVAL_HOURS = "6"
OPERATION_LOG_RETENTION_DAYS = "365"
NOTIFICATION_LOG_RETENTION_DAYS = "365"
OAUTH_STATE_RETENTION_DAYS = "30"

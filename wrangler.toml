name = "life-manager"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = [ "nodejs_compat" ]
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[[d1_databases]]
binding = "LIFE_DB"
database_name = "life-manager-local"
database_id = "local"
migrations_dir = "migrations"

[vars]
ENVIRONMENT = "local"
APP_TIMEZONE = "Asia/Taipei"

[env.staging]
name = "life-manager-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "LIFE_DB"
database_name = "life-manager-staging"
database_id = "4a9da6fd-2fe5-41e1-b17f-0f444e60e14c"
migrations_dir = "migrations"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_TIMEZONE = "Asia/Taipei"
ACCESS_TEAM_DOMAIN = "life-manager.cloudflareaccess.com"
ACCESS_AUD = "0cc6ca1ed73a340419af9e457ce44f52c7b2d67e04272440c223ce6610e1feca"

[env.production]
name = "life-manager"
workers_dev = true

[env.production.vars]
ENVIRONMENT = "production"
APP_TIMEZONE = "Asia/Taipei"
